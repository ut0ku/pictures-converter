services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: captures
      POSTGRES_USER: captures
      POSTGRES_PASSWORD: captures
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U captures -d captures"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/captures
      SPRING_DATASOURCE_USERNAME: captures
      SPRING_DATASOURCE_PASSWORD: captures
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-at-least-32-bytes-long}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
