server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/captures}
    username: ${SPRING_DATASOURCE_USERNAME:captures}
    password: ${SPRING_DATASOURCE_PASSWORD:captures}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_REQUEST_SIZE:500MB}
app:
  cors-origin: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  jwt-secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes-long}
  access-minutes: ${JWT_ACCESS_MINUTES:15}
  refresh-days: ${JWT_REFRESH_DAYS:30}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
springdoc:
  swagger-ui.path: /swagger-ui.html
